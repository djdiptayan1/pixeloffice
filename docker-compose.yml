services:
  pixeloffice:
    image: djdiptayan/pixeloffice:latest
    pull_policy: always
    container_name: pixeloffice-app
    init: true
    restart: unless-stopped
    env_file:
      - path: .env.pixeloffice
        required: false
      - path: .env
        required: false
    environment:
      PORT: 2567
    ports:
      - "127.0.0.1:2567:2567"
    networks:
      - default

networks:
  default:
    name: services_default
    external: true
